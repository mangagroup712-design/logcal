<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planly - カレンダー</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        body {
            background:
                radial-gradient(circle at 15% 0%, rgba(244, 114, 91, 0.18), transparent 30%),
                linear-gradient(180deg, #f7fbff 0%, var(--bg) 100%);
        }

        body > #content {
            max-width: 480px;
            margin: 0 auto;
            padding: calc(var(--top-h) + 20px) 18px calc(var(--tab-h) + 24px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .calendar-shell {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.92);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 48px rgba(50, 85, 120, 0.12);
            backdrop-filter: blur(18px);
        }

        .calendar-hero {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-lg);
            background: rgba(255, 255, 255, 0.74);
            box-shadow: none;
            backdrop-filter: blur(18px);
        }

        .calendar-kicker {
            margin-bottom: 4px;
            color: var(--calender-color);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .calendar-current-month {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.15;
        }

        .calendar-selected-copy {
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.5;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .nav-btn {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(244, 114, 91, 0.2);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.86);
            color: var(--calender-color);
            cursor: pointer;
            box-shadow: 0 10px 24px rgba(244, 114, 91, 0.1);
            transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
        }

        .nav-btn:hover {
            background: var(--calender-color);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(244, 114, 91, 0.22);
        }

        .calendar-container {
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.92);
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 18px 44px rgba(50, 85, 120, 0.13);
            backdrop-filter: blur(18px);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
        }

        .weekday {
            padding: 4px 0 8px;
            text-align: center;
            color: #7e8ba0;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .weekday.sun { color: #df5c55; }
        .weekday.sat { color: #4d83d9; }

        .day-cell {
            min-height: 52px;
            padding: 7px 5px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            border: 1px solid transparent;
            border-radius: var(--radius-lg);
            background: rgba(255, 255, 255, 0.56);
            color: var(--text-primary);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .day-cell:hover:not(.muted) {
            transform: translateY(-2px);
            background: #fff;
            color: #000;
            border-color: rgba(244, 114, 91, 0.22);
            box-shadow: 0 12px 24px rgba(50, 85, 120, 0.1);
        }

        .day-cell:focus-visible {
            outline: 2px solid rgba(244, 114, 91, 0.36);
            outline-offset: 2px;
            background: #fff;
            color: #000;
        }

        .day-cell.muted {
            color: rgba(126, 139, 160, 0.48);
            background: rgba(255, 255, 255, 0.28);
            cursor: default;
        }

        .day-number {
            position: relative;
            z-index: 1;
            min-width: 24px;
            text-align: center;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.3;
        }

        .day-cell.today:not(.selected) {
            border-color: rgba(91, 94, 244, 0.35);
            background: rgba(91, 94, 244, 0.08);
        }

        .day-cell.today:not(.selected) .day-number {
            color: var(--home-color);
        }

        .day-cell.selected {
            color: #fff;
            background: var(--calender-color);
            border-color: transparent;
            box-shadow: 0 18px 34px rgba(244, 114, 91, 0.28);
        }

        .day-cell.selected::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            background: linear-gradient(135deg, #ff8a73 0%, var(--calender-color) 58%, #d95d46 100%);
            z-index: 0;
        }

        .day-cell.selected .day-number,
        .day-cell.selected .event-dots {
            position: relative;
            z-index: 1;
        }

        .event-dots {
            min-height: 7px;
            display: flex;
            justify-content: center;
            gap: 4px;
            position: relative;
            z-index: 1;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.75);
        }

        .dot-blue { background: var(--accent); }
        .dot-teal { background: var(--teal); }
        .dot-purple { background: var(--purple); }

        .day-cell.selected .dot {
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), 0 4px 8px rgba(0, 0, 0, 0.14);
        }

        #schedule-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .event-delete {
            flex-shrink: 0;
            padding: 4px 7px;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 17px;
            line-height: 1;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .event-delete:hover {
            background: #fef0f0;
            color: #e24b4a;
        }

        .tag-select {
            display: flex;
            gap: 8px;
        }

        .tag-opt {
            flex: 1;
            padding: 9px 6px;
            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .tag-opt:hover { transform: translateY(-1px); }
        .tag-opt.selected { border-color: currentColor; }
        .tag-opt.opt-blue { background: #e6f1fb; color: #185fa5; }
        .tag-opt.opt-teal { background: var(--teal-light); color: #0f6e56; }
        .tag-opt.opt-purple { background: var(--purple-light); color: #3c3489; }
    </style>
</head>
<body>
<header id="topbar">
    <div id="topbar-inner">
        <div id="app-brand"><span class="brand-dot"></span><span class="brand-name">Planly</span></div>
        <div class="topbar-actions">
            <button id="notif-btn" type="button" aria-label="通知">
                <span class="notif-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    <span class="notif-badge">0</span>
                </span>
            </button>
            <button id="account-btn" type="button" aria-label="Googleでログイン">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
            </button>
            <div id="notif-panel" class="notif-panel"><div class="notif-panel-header">通知</div><ul id="notif-list" class="notif-list"></ul></div>
        </div>
    </div>
</header>
<main id="content">
    <section class="calendar-shell">
        <div class="calendar-hero">
            <div>
                <p class="calendar-kicker">CALENDAR</p>
                <h1 class="calendar-current-month" id="month-title">読み込み中...</h1>
                <p class="calendar-selected-copy" id="selected-date-copy">日付を選択してください</p>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" id="prev-btn" type="button" aria-label="前の月">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                </button>
                <button class="nav-btn" id="next-btn" type="button" aria-label="次の月">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>
        </div>

        <div class="calendar-container" aria-label="月間カレンダー">
            <div class="calendar-grid" id="calendar-grid"></div>
        </div>
    </section>

    <section id="schedule-section">
        <div class="section-header-row">
            <h2 class="section-title" id="selected-date-title">選択日の予定</h2>
            <button class="add-btn" id="open-event-modal" type="button" aria-label="予定を追加">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                追加
            </button>
        </div>
        <ul class="event-list" id="event-list"></ul>
    </section>
</main>

<div class="modal-overlay" id="modal-overlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <p class="modal-title" id="modal-title">予定を追加</p>
        <div class="modal-field">
            <label class="modal-label" for="input-name">予定名</label>
            <input class="modal-input" id="input-name" type="text" placeholder="例: チームミーティング">
        </div>
        <div class="modal-row">
            <div class="modal-field">
                <label class="modal-label" for="input-time">時刻</label>
                <input class="modal-input" id="input-time" type="time" value="09:00">
            </div>
            <div class="modal-field">
                <label class="modal-label" for="input-loc">場所</label>
                <input class="modal-input" id="input-loc" type="text" placeholder="例: Zoom">
            </div>
        </div>
        <div class="modal-field">
            <label class="modal-label">カテゴリー</label>
            <div class="tag-select">
                <button class="tag-opt opt-blue selected" type="button" data-tag="blue">会議</button>
                <button class="tag-opt opt-teal" type="button" data-tag="teal">作業</button>
                <button class="tag-opt opt-purple" type="button" data-tag="purple">面談</button>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" id="modal-cancel" type="button">キャンセル</button>
            <button class="btn-save" id="modal-save" type="button">保存する</button>
        </div>
    </div>
</div>

<nav id="tabs" role="navigation" aria-label="メインナビゲーション">
    <button id="home-tab" class="tab-btn" type="button">
        <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
        <span class="tab-label">ホーム</span>
    </button>
    <button id="calender-tab" class="tab-btn active" type="button">
        <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
        <span class="tab-label">カレンダー</span>
    </button>
    <button id="settings-tab" class="tab-btn" type="button">
        <span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        <span class="tab-label">設定</span>
    </button>
</nav>

<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>
<script src="Planly.js"></script>
<script src="home.js"></script>
<script src="firebasemsg.js"></script>
<script src="firebase-sync.js"></script>
<script src="firebase-sync.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const today = new Date();
    let curYear = today.getFullYear();
    let curMonth = today.getMonth() + 1;
    let selYear = curYear;
    let selMonth = curMonth;
    let selDay = today.getDate();
    let selectedTag = 'blue';

    const monthTitle = document.getElementById('month-title');
    const selectedCopy = document.getElementById('selected-date-copy');
    const selectedTitle = document.getElementById('selected-date-title');
    const grid = document.getElementById('calendar-grid');
    const list = document.getElementById('event-list');
    const modal = document.getElementById('modal-overlay');
    const inputName = document.getElementById('input-name');
    const inputTime = document.getElementById('input-time');
    const inputLoc = document.getElementById('input-loc');

    function selectedDateString() {
        return selYear + '-' + String(selMonth).padStart(2, '0') + '-' + String(selDay).padStart(2, '0');
    }

    function displayDate(year, month, day) {
        return year + '年' + month + '月' + day + '日';
    }

    function dotTags(events) {
        return [...new Set(events.map(event => event.tag || 'blue'))].slice(0, 3);
    }

    function renderCalendar() {
        monthTitle.textContent = curYear + '年 ' + curMonth + '月';
        selectedCopy.textContent = displayDate(selYear, selMonth, selDay) + 'を選択中';
        grid.innerHTML = '';

        ['日', '月', '火', '水', '木', '金', '土'].forEach(function(weekday, index) {
            const el = document.createElement('div');
            el.className = 'weekday' + (index === 0 ? ' sun' : index === 6 ? ' sat' : '');
            el.textContent = weekday;
            grid.appendChild(el);
        });

        const firstDay = new Date(curYear, curMonth - 1, 1).getDay();
        const lastDate = new Date(curYear, curMonth, 0).getDate();
        const prevLast = new Date(curYear, curMonth - 1, 0).getDate();
        const allEvents = getEvents();

        for (let index = 0; index < firstDay; index++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell muted';
            cell.innerHTML = '<span class="day-number">' + (prevLast - firstDay + 1 + index) + '</span><span class="event-dots"></span>';
            grid.appendChild(cell);
        }

        for (let day = 1; day <= lastDate; day++) {
            const dateString = curYear + '-' + String(curMonth).padStart(2, '0') + '-' + String(day).padStart(2, '0');
            const isToday = curYear === today.getFullYear() && curMonth === today.getMonth() + 1 && day === today.getDate();
            const isSelected = curYear === selYear && curMonth === selMonth && day === selDay;
            const events = allEvents.filter(event => event.date === dateString);
            const cell = document.createElement('button');
            cell.type = 'button';
            cell.className = 'day-cell' + (isToday ? ' today' : '') + (isSelected ? ' selected' : '');
            cell.setAttribute('aria-label', displayDate(curYear, curMonth, day));
            cell.setAttribute('aria-pressed', isSelected ? 'true' : 'false');

            const dots = dotTags(events).map(tag => '<span class="dot dot-' + escHtml(tag) + '"></span>').join('');
            cell.innerHTML = '<span class="day-number">' + day + '</span><span class="event-dots">' + dots + '</span>';
            cell.addEventListener('click', function() {
                selYear = curYear;
                selMonth = curMonth;
                selDay = day;
                renderCalendar();
                renderSchedule();
            });
            grid.appendChild(cell);
        }

        const remainder = (firstDay + lastDate) % 7 === 0 ? 0 : 7 - ((firstDay + lastDate) % 7);
        for (let day = 1; day <= remainder; day++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell muted';
            cell.innerHTML = '<span class="day-number">' + day + '</span><span class="event-dots"></span>';
            grid.appendChild(cell);
        }
    }

    function renderSchedule() {
        const events = getEvents(selectedDateString()).sort((a, b) => a.time.localeCompare(b.time));
        selectedTitle.textContent = displayDate(selYear, selMonth, selDay) + 'の予定';
        list.innerHTML = '';

        if (events.length === 0) {
            const li = document.createElement('li');
            li.className = 'no-events';
            li.textContent = '予定はありません。「追加」から登録できます。';
            list.appendChild(li);
            return;
        }

        events.forEach(function(event) {
            const li = document.createElement('li');
            li.className = 'event-item';
            li.innerHTML =
                '<span class="event-time">' + escHtml(event.time) + '</span>' +
                '<div class="event-info">' +
                    '<span class="event-name">' + escHtml(event.name) + '</span>' +
                    (event.loc ? '<span class="event-loc">' + escHtml(event.loc) + '</span>' : '') +
                '</div>' +
                '<span class="event-tag tag-' + escHtml(event.tag) + '">' + escHtml(event.tagName) + '</span>' +
                '<button class="event-delete" type="button" data-id="' + event.id + '" aria-label="削除">×</button>';
            list.appendChild(li);
        });

        list.querySelectorAll('.event-delete').forEach(function(button) {
            button.addEventListener('click', function() {
                deleteEvent(Number(button.dataset.id));
                renderCalendar();
                renderSchedule();
            });
        });
    }

    function openModal() {
        document.getElementById('modal-title').textContent = displayDate(selYear, selMonth, selDay) + 'に予定を追加';
        inputName.value = '';
        inputTime.value = '09:00';
        inputLoc.value = '';
        selectedTag = 'blue';
        document.querySelectorAll('.tag-opt').forEach(button => button.classList.toggle('selected', button.dataset.tag === selectedTag));
        modal.classList.remove('closing');
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        setTimeout(function() { inputName.focus(); }, 120);
    }

    function closeModal() {
        if (!modal.classList.contains('open')) return;
        modal.classList.add('closing');
        modal.setAttribute('aria-hidden', 'true');
        setTimeout(function() {
            modal.classList.remove('open', 'closing');
        }, 280);
    }

    document.querySelectorAll('.tag-opt').forEach(function(button) {
        button.addEventListener('click', function() {
            selectedTag = button.dataset.tag;
            document.querySelectorAll('.tag-opt').forEach(item => item.classList.remove('selected'));
            button.classList.add('selected');
        });
    });

    document.getElementById('open-event-modal').addEventListener('click', openModal);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    modal.addEventListener('click', function(event) {
        if (event.target === modal) closeModal();
    });

    document.getElementById('modal-save').addEventListener('click', function() {
        const name = inputName.value.trim();
        if (!name) {
            inputName.focus();
            return;
        }
        addEvent(selectedDateString(), inputTime.value, name, inputLoc.value.trim(), selectedTag);
        closeModal();
        renderCalendar();
        renderSchedule();
    });

    inputName.addEventListener('keydown', function(event) {
        if (event.key === 'Enter') document.getElementById('modal-save').click();
    });

    function syncSelectedToVisibleMonth() {
        selYear = curYear;
        selMonth = curMonth;
        selDay = 1;
    }

    document.getElementById('prev-btn').addEventListener('click', function() {
        curMonth--;
        if (curMonth < 1) {
            curMonth = 12;
            curYear--;
        }
        syncSelectedToVisibleMonth();
        renderCalendar();
        renderSchedule();
    });

    document.getElementById('next-btn').addEventListener('click', function() {
        curMonth++;
        if (curMonth > 12) {
            curMonth = 1;
            curYear++;
        }
        syncSelectedToVisibleMonth();
        renderCalendar();
        renderSchedule();
    });

    window._planlyPageRefresh = function() {
        renderCalendar();
        renderSchedule();
    };

    renderCalendar();
    renderSchedule();
});
</script>
</body>
</html>
