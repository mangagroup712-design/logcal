<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logcal - settings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
    <header id="topbar">
        <div id="topbar-inner">
            <div id="app-brand"><span class="brand-dot"></span><span class="brand-name">Logcal</span></div>
            <div class="topbar-actions">
                <button id="notif-btn" type="button" aria-label="通知">
                    <span class="notif-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        <span class="notif-badge">0</span>
                    </span>
                </button>
                <button id="account-btn" type="button" aria-label="Googleでログイン">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
                <div id="notif-panel" class="notif-panel"><div class="notif-panel-header">通知</div><ul id="notif-list" class="notif-list"></ul></div>
            </div>
        </div>
    </header>

    <main id="content">
        <section class="greeting-section">
            <p class="greeting-sub">アプリの状態</p>
            <h1 class="greeting-title">設定</h1>
        </section>

        <section class="settings-card">
            <div class="settings-row"><div class="settings-info"><span class="settings-label">未完了タスク</span><span class="settings-desc">現在残っているタスク数</span></div><span class="settings-value" id="settings-task-count">0件</span></div>
            <div class="settings-divider"></div>
            <div class="settings-row"><div class="settings-info"><span class="settings-label">登録済み予定</span><span class="settings-desc">全期間の予定数</span></div><span class="settings-value" id="settings-event-count">0件</span></div>
            <div class="settings-divider"></div>
            <div class="settings-row"><div class="settings-info"><span class="settings-label">カテゴリー</span><span class="settings-desc">タスク分類の数</span></div><span class="settings-value" id="settings-category-count">0件</span></div>
        </section>

        <section class="settings-card">
            <div class="settings-row"><div class="settings-info"><span class="settings-label">通知</span><span class="settings-desc">未読通知をすべて既読にします</span></div><button class="settings-btn" id="read-all-btn" type="button">既読にする</button></div>
            <div class="settings-divider"></div>
            <div class="settings-row"><div class="settings-info"><span class="settings-label">保存データ</span><span class="settings-desc">このブラウザ内のLogcalデータを削除します</span></div><button class="settings-btn btn-danger" id="clear-data-btn" type="button">リセット</button></div>
        </section>

        <section class="settings-card">
            <div class="settings-row">
                <div class="settings-info"><span class="settings-label">端末通知</span><span class="settings-desc" id="notification-status">通知状態を確認中...</span></div>
                <button class="settings-btn" id="enable-notification-btn" type="button">通知を許可</button>
            </div>
            <div class="settings-divider"></div>
            <div class="settings-row notification-settings-row">
                <div class="settings-info">
                    <span class="settings-label">通知タイミング</span>
                    <span class="settings-desc">タスク時刻の何分前に通知するかを複数指定できます</span>
                </div>
                <div class="offset-editor">
                    <div class="offset-input-row">
                        <input class="modal-input" id="offset-input" type="number" min="0" max="10080" step="1" value="60" aria-label="通知する分数">
                        <button class="settings-btn" id="add-offset-btn" type="button">追加</button>
                    </div>
                    <div class="offset-list" id="offset-list"></div>
                </div>
            </div>
            <div class="settings-divider"></div>
            <div class="settings-row"><div class="settings-info"><span class="settings-label">FCM Token</span><span class="settings-desc">サーバー配信に使う端末識別トークン</span></div><span class="settings-value" id="fcm-token-status">未取得</span></div>
        </section>
    </main>

    <nav id="tabs" role="navigation" aria-label="メインナビゲーション">
        <button id="home-tab" class="tab-btn" type="button"><span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="tab-label">ホーム</span></button>
        <button id="calender-tab" class="tab-btn" type="button"><span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><span class="tab-label">カレンダー</span></button>
        <button id="settings-tab" class="tab-btn active" type="button"><span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span><span class="tab-label">設定</span></button>
    </nav>

    <button class="fab-add-btn" id="open-task-page" type="button" aria-label="タスクを追加">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
</div>

<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>
    <script src="Logcal.js"></script>
<script src="home.js"></script>
<script src="firebasemsg.js"></script>
<script src="firebase-sync.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    function renderSettings() {
        document.getElementById('settings-task-count').textContent = getTasks().filter(task => !task.done).length + '件';
        document.getElementById('settings-event-count').textContent = getEvents().length + '件';
        document.getElementById('settings-category-count').textContent = getCategories().length + '件';
        renderNotificationSettings();
        updateBadgeUI();
    }

    function renderNotificationSettings() {
        const permission = 'Notification' in window ? Notification.permission : 'unsupported';
        const status = document.getElementById('notification-status');
        const token = localStorage.getItem(PLANLY_KEYS.fcmToken);
        const labels = {
            granted: '許可済み。タスク時刻にあわせて通知します。',
            denied: 'ブラウザで通知がブロックされています。',
            default: '未許可。通知を使うには許可してください。',
            unsupported: 'このブラウザは通知に対応していません。'
        };

        status.textContent = labels[permission] || labels.default;
        document.getElementById('enable-notification-btn').disabled = permission === 'granted' || permission === 'unsupported';
        document.getElementById('fcm-token-status').textContent = token ? token.slice(0, 12) + '...' : '未取得';

        const offsetList = document.getElementById('offset-list');
        offsetList.innerHTML = '';
        getNotificationOffsets().forEach(function(offset) {
            const chip = document.createElement('button');
            chip.className = 'offset-chip';
            chip.type = 'button';
            chip.textContent = formatOffsetLabel(offset) + ' ×';
            chip.title = 'クリックで削除';
            chip.addEventListener('click', function() {
                saveNotificationOffsets(getNotificationOffsets().filter(value => value !== offset));
                renderSettings();
            });
            offsetList.appendChild(chip);
        });
    }

    document.getElementById('read-all-btn').addEventListener('click', function() {
        markAllRead();
        renderSettings();
    });

    document.getElementById('clear-data-btn').addEventListener('click', function() {
        if (!confirm('保存データをすべて削除します。よろしいですか？')) return;
        Object.values(PLANLY_KEYS).forEach(key => localStorage.removeItem(key));
        renderSettings();
    });

    document.getElementById('enable-notification-btn').addEventListener('click', async function() {
        const result = await requestLogcalNotificationPermission();
        if (!result.ok && result.reason) alert(result.reason);
        renderSettings();
    });

    document.getElementById('add-offset-btn').addEventListener('click', function() {
        const input = document.getElementById('offset-input');
        const value = Number(input.value);
        if (!Number.isFinite(value) || value < 0 || value > 10080) {
            input.focus();
            return;
        }
        saveNotificationOffsets([...getNotificationOffsets(), Math.round(value)]);
        renderSettings();
    });

    window._planlyPageRefresh = renderSettings;
    renderSettings();
});
</script>
</body>
</html>
