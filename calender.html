<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4725b">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" id="favicon" href="">
    <title>Logcal - カレンダー</title>
    <script>
    (function() {
        var saved = localStorage.getItem('planly_theme');
        if (saved === 'dark' || saved === 'warm' || saved === 'olive' || saved === 'moon' || saved === 'neon' || saved === 'sakura' || saved === 'nightsky') {
            document.documentElement.setAttribute('data-theme', saved);
        }
        var darkThemes = { dark: 1, moon: 1, neon: 1, nightsky: 1 };
        document.getElementById('favicon').href = darkThemes[saved] ? 'logcal-logo-dark.ico' : 'logcal-logo-white.ico';
    })();
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=Varela+Round&display=swap" rel="stylesheet">
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(function(OneSignal) {
        OneSignal.init({
            appId: "f1fddbbe-ea99-48be-989c-effed57c9f03",
            allowLocalhostAsSecureOrigin: true,
            notifyButton: { enable: false },
            serviceWorkerParam: { scope: "/" },
            serviceWorkerPath: "OneSignalSDKWorker.js"
        });
    });
    </script>
    <style>
        body {
            background:
                radial-gradient(circle at 15% 0%, rgba(244, 114, 91, 0.18), transparent 30%),
                linear-gradient(180deg, #f7fbff 0%, var(--bg) 100%);
        }

        body > #content {
            max-width: 480px;
            margin: 0 auto;
            padding: calc(var(--top-h) + 20px) 18px calc(var(--tab-h) + 24px);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .calendar-shell {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.92);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 48px rgba(50, 85, 120, 0.12);
            backdrop-filter: blur(18px);
        }

        .calendar-hero {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-lg);
            background: rgba(255, 255, 255, 0.74);
            box-shadow: none;
            backdrop-filter: blur(18px);
        }

        .calendar-kicker {
            margin-bottom: 4px;
            color: var(--calender-color);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .calendar-current-month {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.15;
        }

        .calendar-selected-copy {
            margin-top: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.5;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .nav-btn {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.92);
            color: var(--calender-color);
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
            transition: transform 0.18s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
        }

        .nav-btn:hover {
            background: var(--calender-color);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .calendar-container {
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.92);
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.78);
            box-shadow: 0 18px 44px rgba(50, 85, 120, 0.13);
            backdrop-filter: blur(18px);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
        }

        .weekday {
            padding: 4px 0 8px;
            text-align: center;
            color: #7e8ba0;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .weekday.sun { color: #df5c55; }
        .weekday.sat { color: #4d83d9; }

        .day-cell {
            min-height: 52px;
            padding: 7px 5px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            border: none;
            border-radius: var(--radius-lg);
            background: rgba(255, 255, 255, 0.56);
            color: var(--text-primary);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        }

        .day-cell:hover:not(.muted) {
            transform: translateY(-2px);
            background: var(--surface);
            color: var(--text-primary);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        .day-cell:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            background: var(--surface);
            color: var(--text-primary);
        }

        .day-cell.muted {
            color: rgba(126, 139, 160, 0.48);
            background: rgba(255, 255, 255, 0.28);
            cursor: default;
        }

        .day-cell:hover:not(.muted) {
            transform: translateY(-2px);
            background: #fff;
            color: #000;
            box-shadow: 0 12px 24px rgba(50, 85, 120, 0.1);
        }

        .day-cell:focus-visible {
            outline: 2px solid rgba(244, 114, 91, 0.36);
            outline-offset: 2px;
            background: #fff;
            color: #000;
        }

        .day-cell.muted {
            color: rgba(126, 139, 160, 0.48);
            background: rgba(255, 255, 255, 0.28);
            cursor: default;
        }

        .day-cell:hover:not(.muted) {

            background: var(--surface);
            color: var(--text-primary);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        .day-cell:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            background: var(--surface);
            color: var(--text-primary);
        }

        .day-cell:focus-visible {
            outline: 2px solid rgba(244, 114, 91, 0.36);
            outline-offset: 2px;
            background: #fff;
            color: #000;
        }

        .day-cell.muted {
            color: rgba(126, 139, 160, 0.48);
            background: rgba(255, 255, 255, 0.28);
            cursor: default;
        }

        .day-number {
            position: relative;
            z-index: 1;
            min-width: 24px;
            text-align: center;
            font-size: 14px;
            font-weight: 800;
            line-height: 1.3;
            color: var(--text-primary);
        }

        .day-cell.today:not(.selected) {
            background: rgba(91, 94, 244, 0.08);
        }

        .day-cell.today:not(.selected) .day-number {
            color: var(--home-color);
        }

        .day-cell.selected {
            color: #fff;
            background: var(--calender-color);
            border: none;
            box-shadow: 0 8px 24px rgba(244, 114, 91, 0.28);
        }

        .day-cell.today.selected {
            border: none !important;
            outline: none !important;
            box-shadow: 0 8px 24px rgba(244, 114, 91, 0.28) !important;
        }

        .day-cell.selected .day-number {
            color: #fff;
            font-weight: 900;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .day-cell.selected .event-dots {
            position: relative;
            z-index: 1;
        }

        .day-cell.today::before {
            z-index: 0;
        }

        .day-cell:hover:not(.muted) {
            transform: translateY(-2px);
            background: var(--surface);
            color: var(--text-primary);
            border-color: var(--border-md);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.12);
        }

        .day-cell:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            background: var(--surface);
            color: var(--text-primary);
        }

        .event-dots {
            min-height: 7px;
            display: flex;
            justify-content: center;
            gap: 4px;
            position: relative;
            z-index: 1;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.75);
        }

        .dot-blue { background: var(--accent); }
        .dot-teal { background: var(--teal); }
        .dot-purple { background: var(--purple); }

        .day-cell.selected .dot {
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9), 0 4px 8px rgba(0, 0, 0, 0.14);
        }

        #schedule-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .section-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .tag-select {
            display: flex;
            gap: 8px;
        }

        .tag-opt {
            flex: 1;
            padding: 9px 6px;
            border: 2px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .tag-opt:hover { transform: translateY(-1px); }
        .tag-opt.selected { border-color: currentColor; }
        .tag-opt.opt-blue { background: #e6f1fb; color: #185fa5; }
        .tag-opt.opt-teal { background: var(--teal-light); color: #0f6e56; }
        .tag-opt.opt-purple { background: var(--purple-light); color: #3c3489; }

<script>
document.addEventListener('DOMContentLoaded', function() {
    const today = new Date();
    let curYear = today.getFullYear();
    let curMonth = today.getMonth() + 1;
    let selYear = curYear;
    let selMonth = curMonth;
    let selDay = today.getDate();
    let pendingAttachments = [];
    let currentSearch = '';

    const monthTitle = document.getElementById('month-title');
    const selectedCopy = document.getElementById('selected-date-copy');
    const selectedTitle = document.getElementById('selected-date-title');
    const grid = document.getElementById('calendar-grid');
    const list = document.getElementById('event-list');
    const modal = document.getElementById('modal-overlay');
    const inputName = document.getElementById('input-name');
    const inputTime = document.getElementById('input-time');
    const inputLoc = document.getElementById('input-loc');
    const eventCat = document.getElementById('event-input-category');
    const eventRecurring = document.getElementById('event-input-recurring');
    const taskModal = document.getElementById('task-modal');
    const taskText = document.getElementById('task-input-text');
    const taskDue = document.getElementById('task-input-due');
    const taskTime = document.getElementById('task-input-time');
    const taskCat = document.getElementById('task-input-category');
    const taskUrgent = document.getElementById('task-input-urgent');
    const taskMemo = document.getElementById('task-input-memo');
    const taskRecurring = document.getElementById('task-input-recurring');
    const taskFiles = document.getElementById('task-input-files');
    const attachmentPreview = document.getElementById('task-attachment-preview');
    const categoryModal = document.getElementById('category-modal');
    const categoryInput = document.getElementById('category-input-name');
    const detailModal = document.getElementById('event-detail-modal');
    const searchInput = document.getElementById('event-search');
    const confirmModal = document.getElementById('confirm-modal');
    const confirmInput = document.getElementById('confirm-input');
    const confirmOk = document.getElementById('confirm-ok');
    const confirmCancel = document.getElementById('confirm-cancel');
    const confirmMsg = document.getElementById('confirm-msg');
    let _confirmExpected = '';
    let _confirmCallback = null;

    function selectedDateString() {
        return selYear + '-' + String(selMonth).padStart(2, '0') + '-' + String(selDay).padStart(2, '0');
    }

    function displayDate(year, month, day) {
        return year + '年' + month + '月' + day + '日';
    }

    function dotTags(events) {
        return [...new Set(events.map(function(e) { return e.tag || 'blue'; }))].slice(0, 3);
    }

    function renderCalendar() {
        monthTitle.textContent = curYear + '年 ' + curMonth + '月';
        selectedCopy.textContent = displayDate(selYear, selMonth, selDay) + 'を選択中';
        grid.innerHTML = '';

        ['日', '月', '火', '水', '木', '金', '土'].forEach(function(weekday, index) {
            const el = document.createElement('div');
            el.className = 'weekday' + (index === 0 ? ' sun' : index === 6 ? ' sat' : '');
            el.textContent = weekday;
            grid.appendChild(el);
        });

        const firstDay = new Date(curYear, curMonth - 1, 1).getDay();
        const lastDate = new Date(curYear, curMonth, 0).getDate();
        const prevLast = new Date(curYear, curMonth - 1, 0).getDate();
        const allEvents = getEvents();

        for (let index = 0; index < firstDay; index++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell muted';
            cell.innerHTML = '<span class="day-number">' + (prevLast - firstDay + 1 + index) + '</span><span class="event-dots"></span>';
            grid.appendChild(cell);
        }

        for (let day = 1; day <= lastDate; day++) {
            const dateString = curYear + '-' + String(curMonth).padStart(2, '0') + '-' + String(day).padStart(2, '0');
            const isToday = curYear === today.getFullYear() && curMonth === today.getMonth() + 1 && day === today.getDate();
            const isSelected = curYear === selYear && curMonth === selMonth && day === selDay;
            const events = allEvents.filter(function(event) { return event.date === dateString; });
            const tasksForDay = getTasks().filter(function(task) { return task.due === dateString && !task.done; });
            const cell = document.createElement('button');
            cell.type = 'button';
            cell.className = 'day-cell' + (isToday ? ' today' : '') + (isSelected ? ' selected' : '');
            cell.setAttribute('aria-label', displayDate(curYear, curMonth, day));
            cell.setAttribute('aria-pressed', isSelected ? 'true' : 'false');

            const categoryColors = getCategoryColors();
            var eventTags = dotTags(events);
            var allColors = eventTags.map(function(tag) { return categoryColors[tag] || '#A0A0B8'; });
            tasksForDay.forEach(function(task) { allColors.push(categoryColors[task.category] || '#A0A0B8'); });
            const dots = allColors.slice(0, 3).map(function(color) { return '<span class="dot" style="background:' + escHtml(color) + '"></span>'; }).join('');
            cell.innerHTML = '<span class="day-number">' + day + '</span><span class="event-dots">' + dots + '</span>';
            cell.addEventListener('click', function() {
                selYear = curYear;
                selMonth = curMonth;
                selDay = day;
                renderCalendar();
                renderSchedule();
            });
            grid.appendChild(cell);
        }

        const remainder = (firstDay + lastDate) % 7 === 0 ? 0 : 7 - ((firstDay + lastDate) % 7);
        for (let day = 1; day <= remainder; day++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell muted';
            cell.innerHTML = '<span class="day-number">' + day + '</span><span class="event-dots"></span>';
            grid.appendChild(cell);
        }
    }

    function renderSchedule() {
        let events = getEvents(selectedDateString());
        let tasks = getTasks().filter(function(task) { return task.due === selectedDateString(); });
        let items = [];
        events.forEach(function(e) { items.push({ type: 'event', data: e }); });
        tasks.forEach(function(t) { items.push({ type: 'task', data: t }); });
        items.sort(function(a, b) {
            var ta = (a.type === 'event' ? a.data.time : a.data.time) || '23:59';
            var tb = (b.type === 'event' ? b.data.time : b.data.time) || '23:59';
            return ta.localeCompare(tb);
        });
        if (currentSearch) {
            const q = currentSearch.toLowerCase();
            items = items.filter(function(item) {
                var name = item.type === 'event' ? item.data.name : item.data.text;
                var loc = item.type === 'event' ? item.data.loc : item.data.category;
                return (name || '').toLowerCase().indexOf(q) !== -1 || (loc || '').toLowerCase().indexOf(q) !== -1;
            });
        }
        selectedTitle.textContent = displayDate(selYear, selMonth, selDay) + 'の予定';
        list.innerHTML = '';

        if (!items || items.length === 0) {
            const li = document.createElement('li');
            li.className = 'no-events';
            li.textContent = '予定はありません。日付を選択して予定を追加できます。';
            list.appendChild(li);
            return;
        }

        const categoryColors = getCategoryColors();
        items.forEach(function(item) {
            const li = document.createElement('li');
            const color = categoryColors[(item.type === 'event' ? (item.data.tagName || item.data.tag) : item.data.category)] || '#A0A0B8';
            const textColor = getContrastTextColor(color);
            if (item.type === 'event') {
                const event = item.data;
                if (!event || !event.id) return;
                li.className = 'event-item';
                li.innerHTML =
                    '<span class="event-time">' + escHtml(event.time || '09:00') + '</span>' +
                    '<div class="event-info">' +
                        '<span class="event-name" data-id="' + event.id + '" data-kind="event">' + escHtml(event.name || '(名前なし)') + '</span>' +
                        (event.loc ? '<span class="event-loc">' + escHtml(event.loc) + '</span>' : '') +
                    '</div>' +
                    '<span class="event-tag" style="background:' + escHtml(color) + ';color:' + escHtml(textColor) + '">' + escHtml(event.tagName || event.tag || '予定') + '</span>' +
                    '<button class="event-delete" type="button" data-id="' + event.id + '" data-kind="event" aria-label="削除">×</button>';
            } else {
                const task = item.data;
                li.className = 'event-item' + (task.done ? ' task-done' : '');
                li.innerHTML =
                    '<button class="task-check near-task-check' + (task.done ? ' checked' : '') + '" data-id="' + task.id + '" type="button" aria-label="完了を切り替え"></button>' +
                    '<span class="event-time">' + escHtml(task.time || '--:--') + '</span>' +
                    '<div class="event-info">' +
                        '<span class="event-name" data-id="' + task.id + '" data-kind="task">' + escHtml(task.text) + '</span>' +
                        '<span class="event-loc">' + escHtml(task.category) + '</span>' +
                    '</div>' +
                    '<span class="event-tag" style="background:' + escHtml(color) + ';color:' + escHtml(textColor) + '">' + escHtml(task.category || 'タスク') + '</span>' +
                    '<button class="event-delete" type="button" data-id="' + task.id + '" data-kind="task" aria-label="削除">×</button>';
            }
            list.appendChild(li);
        });

        list.querySelectorAll('.event-delete').forEach(function(button) {
            button.addEventListener('click', function() {
                var kind = button.dataset.kind;
                var id = Number(button.dataset.id);
                if (kind === 'task') {
                    var task = getTasks().find(function(t) { return t.id === id; });
                    if (!task) return;
                    openConfirm('削除の確認', '「' + task.text + '」を削除します。', task.text, function() {
                        deleteTask(id);
                        renderCalendar();
                        renderSchedule();
                    });
                } else {
                    if (!confirm('この予定を削除しますか？')) return;
                    deleteEvent(id);
                    renderCalendar();
                    renderSchedule();
                }
            });
        });
        list.querySelectorAll('.event-name').forEach(function(span) {
            span.addEventListener('click', function() {
                var kind = span.dataset.kind;
                var id = Number(span.dataset.id);
                if (kind === 'task') {
                    var task = getTasks().find(function(t) { return t.id === id; });
                    if (task) openEventDetail(task);
                } else {
                    var event = getEvents().find(function(e) { return e.id === id; });
                    if (event) openEventDetail(event);
                }
            });
        });
        list.querySelectorAll('.near-task-check').forEach(function(button) {
            button.addEventListener('click', function() {
                var id = Number(button.dataset.id);
                var task = getTasks().find(function(t) { return t.id === id; });
                if (!task) return;
                openConfirm('完了の確認', '「' + task.text + '」を完了します。', task.text, function() {
                    toggleTask(id);
                    renderCalendar();
                    renderSchedule();
                });
            });
        });
    }

    function openEventDetail(item) {
        var isTask = item.text !== undefined;
        document.getElementById('event-detail-name').textContent = isTask ? item.text : item.name;
        document.getElementById('event-detail-date').textContent = isTask ? (item.due ? formatDue(item.due) : '期限なし') : (item.date ? formatDue(item.date) : '日付なし');
        document.getElementById('event-detail-time').textContent = item.time || '時刻なし';
        document.getElementById('event-detail-loc').textContent = isTask ? (item.category || 'カテゴリーなし') : (item.loc || '場所未設定');
        document.getElementById('event-detail-tag').textContent = isTask ? (item.category || 'タスク') : (item.tagName || item.tag || '予定');
        detailModal.classList.remove('closing');
        detailModal.classList.add('open');
        detailModal.setAttribute('aria-hidden', 'false');
        lockBodyScroll();
    }

    function closeEventDetail() {
        if (!detailModal.classList.contains('open')) return;
        detailModal.classList.add('closing');
        detailModal.setAttribute('aria-hidden', 'true');
        unlockBodyScroll();
        setTimeout(function() { detailModal.classList.remove('open', 'closing'); }, 280);
    }

    function openConfirm(title, message, expectedName, onOk) {
        _confirmExpected = expectedName;
        _confirmCallback = onOk;
        document.getElementById('confirm-title').textContent = title;
        confirmMsg.textContent = message;
        confirmInput.value = '';
        confirmInput.style.borderColor = '';
        confirmOk.disabled = true;
        confirmModal.classList.add('open');
        confirmModal.setAttribute('aria-hidden', 'false');
        lockBodyScroll();
        confirmInput.focus();
    }

    function closeConfirm() {
        confirmModal.classList.remove('open');
        confirmModal.setAttribute('aria-hidden', 'true');
        unlockBodyScroll();
        _confirmExpected = '';
        _confirmCallback = null;
    }

    confirmCancel.addEventListener('click', closeConfirm);
    confirmOk.addEventListener('click', function() {
        if (confirmInput.value.trim() !== _confirmExpected) return;
        if (_confirmCallback) _confirmCallback();
        closeConfirm();
    });
    confirmInput.addEventListener('input', function() {
        var ok = confirmInput.value.trim() === _confirmExpected;
        confirmOk.disabled = !ok;
        confirmInput.style.borderColor = ok ? 'rgba(76,175,80,0.6)' : 'rgba(226,75,74,0.6)';
    });
    confirmInput.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' && !confirmOk.disabled) { confirmOk.click(); }
        if (event.key === 'Escape') { closeConfirm(); }
    });

    function openModal() {
        document.getElementById('modal-title').textContent = displayDate(selYear, selMonth, selDay) + 'に予定を追加';
        inputName.value = '';
        inputTime.value = '09:00';
        inputLoc.value = '';
        eventRecurring.value = '';
        renderCategorySelect(eventCat);
        modal.classList.remove('closing');
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        lockBodyScroll();
        setTimeout(function() { inputName.focus(); }, 120);
    }

    function closeModal() {
        if (!modal.classList.contains('open')) return;
        modal.classList.add('closing');
        modal.setAttribute('aria-hidden', 'true');
        unlockBodyScroll();
        setTimeout(function() { modal.classList.remove('open', 'closing'); }, 280);
    }

    function renderCategorySelect(select) {
        select.innerHTML = '';
        const colors = getCategoryColors();
        getCategories().forEach(function(category) {
            const option = document.createElement('option');
            option.value = category;
            option.textContent = category;
            const color = colors[category] || '#A0A0B8';
            option.style.backgroundColor = color;
            option.style.color = getContrastTextColor(color);
            select.appendChild(option);
        });
    }

    function readFiles(files) {
        return Promise.allSettled(Array.from(files).map(function(file) {
            return new Promise(function(resolve, reject) {
                const reader = new FileReader();
                reader.onload = function() { resolve({ name: file.name, type: file.type, dataUrl: reader.result }); };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        })).then(function(results) {
            const loaded = results.filter(function(r) { return r.status === 'fulfilled'; }).map(function(r) { return r.value; });
            if (loaded.length !== results.length) showToast('一部の添付ファイルを読み込めませんでした');
            return loaded;
        });
    }

    function renderAttachmentPreview() {
        attachmentPreview.innerHTML = pendingAttachments.map(function(file) {
            const thumb = file.type.indexOf('image/') === 0 ? '<img src="' + escHtml(file.dataUrl) + '" alt="">' : '';
            return '<span class="attachment-preview-item">' + thumb + escHtml(file.name) + '</span>';
        }).join('');
    }

    function openTaskModal() {
        taskText.value = '';
        taskDue.value = todayString();
        taskTime.value = '';
        taskMemo.value = '';
        taskRecurring.value = '';
        taskFiles.value = '';
        pendingAttachments = [];
        renderAttachmentPreview();
        taskUrgent.checked = false;
        renderCategorySelect(taskCat);
        taskModal.classList.remove('closing');
        taskModal.classList.add('open');
        taskModal.setAttribute('aria-hidden', 'false');
        lockBodyScroll();
        setTimeout(function() { taskText.focus(); }, 120);
    }

    function closeTaskModal() {
        if (!taskModal.classList.contains('open')) return;
        taskModal.classList.add('closing');
        taskModal.setAttribute('aria-hidden', 'true');
        unlockBodyScroll();
        setTimeout(function() { taskModal.classList.remove('open', 'closing'); }, 280);
    }

    function openCategoryModal() {
        categoryInput.value = '';
        renderCategoryManager();
        categoryModal.classList.remove('closing');
        categoryModal.classList.add('open');
        categoryModal.setAttribute('aria-hidden', 'false');
        lockBodyScroll();
        setTimeout(function() { categoryInput.focus(); }, 120);
    }

    function closeCategoryModal() {
        if (!categoryModal.classList.contains('open')) return;
        categoryModal.classList.add('closing');
        categoryModal.setAttribute('aria-hidden', 'true');
        unlockBodyScroll();
        setTimeout(function() { categoryModal.classList.remove('open', 'closing'); }, 280);
    }

    function renderCategoryManager() {
        const list = document.getElementById('category-list');
        list.innerHTML = '';
        const colors = getCategoryColors();
        getCategories().forEach(function(category) {
            const color = colors[category] || '#A0A0B8';
            const textColor = getContrastTextColor(color);
            const row = document.createElement('div');
            row.className = 'category-manager-item';
            row.style.background = color;
            row.style.color = textColor;
            row.innerHTML = '<span>' + escHtml(category) + '</span><input type="color" class="category-color-picker" value="' + escHtml(color) + '" data-category="' + escHtml(category) + '" aria-label="色を変更" style="position:absolute;opacity:0;width:1px;height:1px;padding:0;border:none;"><button class="category-color-trigger" type="button" aria-label="色を変更" title="色を変更"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 22 5-5"/><path d="m14 4 6 6"/><path d="m13 5 6 6-9 9H4v-6l9-9z"/></svg></button><button class="category-delete" type="button" data-category="' + escHtml(category) + '" aria-label="削除">×</button>';
            list.appendChild(row);
        });
        list.querySelectorAll('.category-color-trigger').forEach(function(btn) {
            btn.addEventListener('click', function() { var picker = btn.previousElementSibling; if (picker) picker.click(); });
        });
        list.querySelectorAll('.category-color-picker').forEach(function(picker) {
            picker.addEventListener('change', function() {
                const colors = getCategoryColors();
                colors[picker.dataset.category] = picker.value;
                saveCategoryColors(colors);
                renderCategoryManager();
                renderCategorySelect(eventCat);
                renderCategorySelect(taskCat);
            });
        });
        list.querySelectorAll('.category-delete').forEach(function(button) {
            button.addEventListener('click', function() {
                const category = button.dataset.category;
                if (DEFAULT_CATEGORIES.includes(category)) return;
                saveCategories(getCategories().filter(function(item) { return item !== category; }));
                saveTasks(getTasks().map(function(task) { return task.category === category ? { ...task, category: 'その他' } : task; }));
                renderCategoryManager();
                renderCategorySelect(eventCat);
                renderCategorySelect(taskCat);
            });
        });
    }

    document.getElementById('open-event-category-modal').addEventListener('click', openCategoryModal);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    modal.addEventListener('click', function(event) { if (event.target === modal) closeModal(); });

    document.getElementById('modal-save').addEventListener('click', function() {
        const name = inputName.value.trim();
        if (!name) { inputName.focus(); return; }
        addEvent(selectedDateString(), inputTime.value, name, inputLoc.value.trim(), eventCat.value, eventRecurring.value);
        closeModal();
        renderCalendar();
        renderSchedule();
        showToast('予定を追加しました');
    });

    document.getElementById('open-task-modal').addEventListener('click', openTaskModal);
    document.getElementById('file-upload-btn').addEventListener('click', function() { taskFiles.click(); });
    taskFiles.addEventListener('change', async function() {
        if (!taskFiles.files || taskFiles.files.length === 0) return;
        pendingAttachments = await readFiles(taskFiles.files);
        renderAttachmentPreview();
    });
    document.getElementById('task-modal-cancel').addEventListener('click', closeTaskModal);
    taskModal.addEventListener('click', function(event) { if (event.target === taskModal) closeTaskModal(); });
    document.getElementById('task-modal-save').addEventListener('click', function() {
        const text = taskText.value.trim();
        if (!text) { taskText.focus(); return; }
        addTask(text, taskDue.value, taskUrgent.checked, taskCat.value, taskTime.value, pendingAttachments, taskMemo.value.trim(), taskRecurring.value, null, '', null);
        closeTaskModal();
        showToast(window._logcalLastAttachmentSaveFailed ? 'タスクを追加しました（添付は容量超過で保存されませんでした）' : 'タスクを追加しました');
    });
    document.getElementById('add-category-btn').addEventListener('click', openCategoryModal);
    document.getElementById('category-modal-close').addEventListener('click', closeCategoryModal);
    categoryModal.addEventListener('click', function(event) { if (event.target === categoryModal) closeCategoryModal(); });
    document.getElementById('category-add-save').addEventListener('click', function() {
        const category = categoryInput.value.trim();
        if (!category) { categoryInput.focus(); return; }
        addCategory(category);
        renderCategoryManager();
        renderCategorySelect(eventCat);
        renderCategorySelect(taskCat);
        categoryInput.value = '';
    });
    document.getElementById('event-detail-close').addEventListener('click', closeEventDetail);
    detailModal.addEventListener('click', function(event) { if (event.target === detailModal) closeEventDetail(); });
    searchInput.addEventListener('input', function() { currentSearch = searchInput.value.trim(); renderSchedule(); });

    inputName.addEventListener('keydown', function(event) { if (event.key === 'Enter') document.getElementById('modal-save').click(); });

    document.addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            if (confirmModal.classList.contains('open')) { closeConfirm(); }
            else if (detailModal.classList.contains('open')) { closeEventDetail(); }
            else if (categoryModal.classList.contains('open')) { closeCategoryModal(); }
            else if (taskModal.classList.contains('open')) { closeTaskModal(); }
            else if (modal.classList.contains('open')) { closeModal(); }
        }
    });

    function syncSelectedToVisibleMonth() {
        selYear = curYear;
        selMonth = curMonth;
        selDay = 1;
    }

    document.getElementById('prev-btn').addEventListener('click', function() {
        curMonth--;
        if (curMonth < 1) { curMonth = 12; curYear--; }
        syncSelectedToVisibleMonth();
        renderCalendar();
        renderSchedule();
    });

    document.getElementById('next-btn').addEventListener('click', function() {
        curMonth++;
        if (curMonth > 12) { curMonth = 1; curYear++; }
        syncSelectedToVisibleMonth();
        renderCalendar();
        renderSchedule();
    });

    window._planlyPageRefresh = function() {
        renderCalendar();
        renderSchedule();
    };

    renderCalendar();
    renderSchedule();
    renderCategorySelect(eventCat);
});
</script>
</body>
</html>
