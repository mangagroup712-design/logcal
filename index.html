<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logcal - ホーム</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
    <header id="topbar">
        <div id="topbar-inner">
            <div id="app-brand"><span class="brand-dot"></span><span class="brand-name">Logcal</span></div>
            <div class="topbar-actions">
                <button id="notif-btn" type="button" aria-label="通知">
                    <span class="notif-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        <span class="notif-badge">0</span>
                    </span>
                </button>
                <button id="account-btn" type="button" aria-label="Googleでログイン">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
                <div id="notif-panel" class="notif-panel"><div class="notif-panel-header">通知</div><ul id="notif-list" class="notif-list"></ul></div>
            </div>
        </div>
    </header>

    <main id="content">
        <section class="greeting-section">
            <p class="greeting-sub">おはようございます</p>
            <h1 class="greeting-title">今日もよい一日を</h1>
        </section>

        <section class="cards-row">
            <div class="summary-card card-tasks"><span class="card-label">タスク</span><span class="card-number" id="task-count">0</span><span class="card-sub">未完了</span></div>
            <div class="summary-card card-events"><span class="card-label">予定</span><span class="card-number" id="event-count">0</span><span class="card-sub">今日</span></div>
        </section>

        <section class="section-block"><div class="section-header-row"><h2 class="section-title">直近の予定</h2><button class="add-btn" id="open-event-page" type="button">予定を追加</button></div><ul class="event-list" id="event-list"></ul></section>
        <section class="section-block"><div class="section-header-row"><h2 class="section-title">タスク</h2><button class="add-btn" id="open-category-modal" type="button">カテゴリー管理</button></div><div id="tasks-container"></div></section>
    </main>

    <button class="fab-add-btn" id="open-task-modal" type="button" aria-label="タスクを追加">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <nav id="tabs" role="navigation" aria-label="メインナビゲーション">
        <button id="home-tab" class="tab-btn active" type="button"><span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span><span class="tab-label">ホーム</span></button>
        <button id="calender-tab" class="tab-btn" type="button"><span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span><span class="tab-label">カレンダー</span></button>
        <button id="settings-tab" class="tab-btn" type="button"><span class="tab-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span><span class="tab-label">設定</span></button>
    </nav>
</div>

<div class="modal-overlay" id="task-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
        <p class="modal-title" id="task-modal-title">タスクを追加</p>
        <div class="modal-field"><label class="modal-label" for="task-input-text">タスク名</label><input class="modal-input" id="task-input-text" type="text" placeholder="例: 企画書の修正"></div>
        <div class="modal-field"><label class="modal-label" for="task-input-category">カテゴリー</label><div style="display:flex; gap:8px;"><select class="modal-input" id="task-input-category" style="flex:1;"></select><button class="btn-cancel" id="add-category-btn" type="button" style="flex:0 0 auto; padding:0 16px;">追加</button></div></div>
        <div class="modal-row"><div class="modal-field"><label class="modal-label" for="task-input-due">期限</label><input class="modal-input" id="task-input-due" type="date"></div><div class="modal-field"><label class="modal-label" for="task-input-time">時刻</label><input class="modal-input" id="task-input-time" type="time"></div></div>
        <div class="modal-field attachment-file"><label class="modal-label" for="task-input-files">添付ファイル</label><input class="modal-input" id="task-input-files" type="file" accept="image/*" multiple style="display:none;"><button class="file-upload-btn" id="file-upload-btn" type="button">ファイルを選択</button><div class="attachment-preview" id="task-attachment-preview"></div></div>
        <div class="modal-field"><label class="modal-label">緊急</label><label class="toggle-label"><input type="checkbox" id="task-input-urgent"><span class="toggle-track"><span class="toggle-thumb"></span></span><span class="toggle-text">急ぎ</span></label></div>
        <div class="modal-actions"><button class="btn-cancel" id="task-modal-cancel" type="button">キャンセル</button><button class="btn-save" id="task-modal-save" type="button">保存する</button></div>
    </div>
</div>

<div class="modal-overlay" id="category-modal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="category-modal-title">
        <p class="modal-title" id="category-modal-title">カテゴリー管理</p>
        <div class="modal-field"><label class="modal-label" for="category-input-name">新しいカテゴリー</label><div style="display:flex; gap:8px;"><input class="modal-input" id="category-input-name" type="text" placeholder="例: 学校" style="flex:1;"><button class="btn-save" id="category-add-save" type="button" style="flex:0 0 auto;">追加</button></div></div>
        <div class="category-list" id="category-list"></div>
        <div class="modal-actions"><button class="btn-cancel" id="category-modal-close" type="button">閉じる</button></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore-compat.js"></script>
    <script src="Logcal.js"></script>
<script src="home.js"></script>
<script src="firebasemsg.js"></script>
<script src="firebase-sync.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const modal = document.getElementById('task-modal');
    const inputText = document.getElementById('task-input-text');
    const inputDue = document.getElementById('task-input-due');
    const inputTime = document.getElementById('task-input-time');
    const inputCat = document.getElementById('task-input-category');
    const inputUrgent = document.getElementById('task-input-urgent');
    const inputFiles = document.getElementById('task-input-files');
    const attachmentPreview = document.getElementById('task-attachment-preview');
    const categoryModal = document.getElementById('category-modal');
    const categoryInput = document.getElementById('category-input-name');
    let pendingAttachments = [];

    function openModal() {
        inputText.value = '';
        inputDue.value = todayString();
        inputTime.value = '';
        inputFiles.value = '';
        pendingAttachments = [];
        renderAttachmentPreview();
        inputUrgent.checked = false;
        renderCategorySelect();
        modal.classList.remove('closing');
        modal.classList.add('open');
        modal.setAttribute('aria-hidden', 'false');
        setTimeout(function() { inputText.focus(); }, 120);
    }

    function closeModal() {
        if (!modal.classList.contains('open')) return;
        modal.classList.add('closing');
        modal.setAttribute('aria-hidden', 'true');
        setTimeout(function() { modal.classList.remove('open', 'closing'); }, 280);
    }

    function renderAll() {
        renderTasks();
        renderEvents();
        renderCounts();
        renderCategorySelect();
    }

    function renderTasks() {
        const container = document.getElementById('tasks-container');
        const tasks = getTasks();
        const colors = getCategoryColors();
        const grouped = new Map(getCategories().map(category => [category, []]));
        tasks.forEach(function(task) {
            const category = task.category || 'その他';
            if (!grouped.has(category)) grouped.set(category, []);
            grouped.get(category).push(task);
        });
        container.innerHTML = '';
        grouped.forEach(function(catTasks, category) {
            if (catTasks.length === 0) return;
            const color = colors[category] || '#A0A0B8';
            const textColor = getContrastTextColor(color);
            const details = document.createElement('details');
            details.className = 'category-block';
            details.open = true;
            const summary = document.createElement('summary');
            summary.className = 'category-header';
            summary.style.background = color;
            summary.style.color = textColor;
            summary.innerHTML = '<span>' + escHtml(category) + '</span> <span style="opacity:0.72; font-size:14px; font-weight:normal;">' + catTasks.filter(task => !task.done).length + '件</span>';
            details.appendChild(summary);
            const list = document.createElement('ul');
            list.className = 'task-list';
            catTasks.forEach(function(task) {
                const li = document.createElement('li');
                li.className = 'task-item' + (task.urgent ? ' urgent' : '');
                li.style.setProperty('--category-color', color);
                const dueText = task.done ? '完了' : escHtml(formatDue(task.due) + (task.time ? ' ' + task.time : ''));
                li.innerHTML = '<button class="task-check' + (task.done ? ' checked' : '') + '" data-id="' + task.id + '" type="button" aria-label="完了を切り替え"></button><span class="task-text' + (task.done ? ' done' : '') + '">' + escHtml(task.text) + '</span><span class="task-due' + (task.done ? ' done' : task.urgent ? ' urgent' : '') + '">' + dueText + '</span><button class="task-delete" data-id="' + task.id + '" type="button" aria-label="削除">×</button>';
                if (task.attachments.length) {
                    const files = document.createElement('div');
                    files.className = 'task-attachments';
                    files.innerHTML = task.attachments.map(function(file) {
                        const thumb = file.type.indexOf('image/') === 0 ? '<img src="' + escHtml(file.dataUrl) + '" alt="">' : '';
                        return '<a class="task-attachment" href="' + escHtml(file.dataUrl) + '" target="_blank" rel="noopener">' + thumb + '<span>' + escHtml(file.name) + '</span></a>';
                    }).join('');
                    li.appendChild(files);
                }
                list.appendChild(li);
            });
            details.appendChild(list);
            container.appendChild(details);
        });
        container.querySelectorAll('.task-check').forEach(button => button.addEventListener('click', function() { toggleTask(Number(button.dataset.id)); renderAll(); }));
        container.querySelectorAll('.task-delete').forEach(button => button.addEventListener('click', function() { deleteTask(Number(button.dataset.id)); renderAll(); }));
    }

    function readFiles(files) {
        return Promise.all(Array.from(files).map(function(file) {
            return new Promise(function(resolve, reject) {
                const reader = new FileReader();
                reader.onload = function() {
                    resolve({ name: file.name, type: file.type, dataUrl: reader.result });
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }));
    }

    function renderAttachmentPreview() {
        attachmentPreview.innerHTML = pendingAttachments.map(function(file) {
            const thumb = file.type.indexOf('image/') === 0 ? '<img src="' + escHtml(file.dataUrl) + '" alt="">' : '';
            return '<span class="attachment-preview-item">' + thumb + escHtml(file.name) + '</span>';
        }).join('');
    }

    function openCategoryModal() {
        categoryInput.value = '';
        renderCategoryManager();
        categoryModal.classList.remove('closing');
        categoryModal.classList.add('open');
        categoryModal.setAttribute('aria-hidden', 'false');
        setTimeout(function() { categoryInput.focus(); }, 120);
    }

    function closeCategoryModal() {
        if (!categoryModal.classList.contains('open')) return;
        categoryModal.classList.add('closing');
        categoryModal.setAttribute('aria-hidden', 'true');
        setTimeout(function() { categoryModal.classList.remove('open', 'closing'); }, 280);
    }

    function renderCategoryManager() {
        const list = document.getElementById('category-list');
        list.innerHTML = '';
        const colors = getCategoryColors();
        getCategories().forEach(function(category) {
            const color = colors[category] || '#A0A0B8';
            const textColor = getContrastTextColor(color);
            const row = document.createElement('div');
            row.className = 'category-manager-item';
            row.style.background = color;
            row.style.color = textColor;
            row.innerHTML = '<span>' + escHtml(category) + '</span><input type="color" class="category-color-picker" value="' + escHtml(color) + '" data-category="' + escHtml(category) + '" aria-label="色を変更"><button class="category-delete" type="button" data-category="' + escHtml(category) + '" aria-label="削除">×</button>';
            list.appendChild(row);
        });
        list.querySelectorAll('.category-color-picker').forEach(function(picker) {
            picker.addEventListener('input', function() {
                const category = picker.dataset.category;
                const newColors = getCategoryColors();
                newColors[category] = picker.value;
                saveCategoryColors(newColors);
                renderCategoryManager();
                renderAll();
            });
        });
        list.querySelectorAll('.category-delete').forEach(function(button) {
            button.addEventListener('click', function() {
                const category = button.dataset.category;
                if (DEFAULT_CATEGORIES.includes(category)) return;
                saveCategories(getCategories().filter(item => item !== category));
                saveTasks(getTasks().map(task => task.category === category ? { ...task, category: 'その他' } : task));
                renderCategoryManager();
                renderAll();
            });
        });
    }

    function renderEvents() {
        const list = document.getElementById('event-list');
        const events = getEvents(todayString()).sort((a, b) => a.time.localeCompare(b.time));
        list.innerHTML = '';
        if (events.length === 0) {
            list.innerHTML = '<li class="no-events">今日の予定はありません</li>';
            return;
        }
        events.forEach(function(event) {
            const li = document.createElement('li');
            li.className = 'event-item';
            li.innerHTML = '<span class="event-time">' + escHtml(event.time) + '</span><div class="event-info"><span class="event-name">' + escHtml(event.name) + '</span>' + (event.loc ? '<span class="event-loc">' + escHtml(event.loc) + '</span>' : '') + '</div><span class="event-tag tag-' + escHtml(event.tag) + '">' + escHtml(event.tagName) + '</span>';
            list.appendChild(li);
        });
    }

    function renderCounts() {
        document.getElementById('task-count').textContent = getTasks().filter(task => !task.done).length;
        document.getElementById('event-count').textContent = getEvents(todayString()).length;
    }

    function renderCategorySelect() {
        inputCat.innerHTML = '';
        const colors = getCategoryColors();
        getCategories().forEach(function(category) {
            const option = document.createElement('option');
            option.value = category;
            option.textContent = category;
            const color = colors[category] || '#A0A0B8';
            option.style.backgroundColor = color;
            option.style.color = getContrastTextColor(color);
            inputCat.appendChild(option);
        });
    }

    document.getElementById('open-task-modal').addEventListener('click', openModal);
    document.getElementById('file-upload-btn').addEventListener('click', function() { inputFiles.click(); });
    document.getElementById('open-event-page').addEventListener('click', function() { navigateWithPageBlur('calender.html'); });
    document.getElementById('task-modal-cancel').addEventListener('click', closeModal);
    modal.addEventListener('click', function(event) { if (event.target === modal) closeModal(); });
    document.getElementById('task-modal-save').addEventListener('click', function() {
        const text = inputText.value.trim();
        if (!text) { inputText.focus(); return; }
        addTask(text, inputDue.value, inputUrgent.checked, inputCat.value, inputTime.value, pendingAttachments);
        closeModal();
        renderAll();
    });
    document.getElementById('add-category-btn').addEventListener('click', function() {
        openCategoryModal();
    });
    inputFiles.addEventListener('change', async function() {
        pendingAttachments = await readFiles(inputFiles.files);
        renderAttachmentPreview();
    });
    document.getElementById('open-category-modal').addEventListener('click', openCategoryModal);
    document.getElementById('category-modal-close').addEventListener('click', closeCategoryModal);
    categoryModal.addEventListener('click', function(event) { if (event.target === categoryModal) closeCategoryModal(); });
    document.getElementById('category-add-save').addEventListener('click', function() {
        const category = categoryInput.value.trim();
        if (!category) { categoryInput.focus(); return; }
        addCategory(category);
        renderCategoryManager();
        renderCategorySelect();
        inputCat.value = category;
        categoryInput.value = '';
        renderAll();
    });
    categoryInput.addEventListener('keydown', function(event) { if (event.key === 'Enter') document.getElementById('category-add-save').click(); });
    inputText.addEventListener('keydown', function(event) { if (event.key === 'Enter') document.getElementById('task-modal-save').click(); });

    window._planlyPageRefresh = renderAll;
    renderAll();
    if (window.location.hash === '#open-task') {
        history.replaceState(null, '', window.location.pathname + window.location.search);
        openModal();
    }
});
</script>
</body>
</html>
